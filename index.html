    function downloadAtsResumePdf() {
      const pageWidth = 595.28;
      const pageHeight = 841.89;
      const left = 43;

      const commands = [];
      const measurementContext = document.createElement("canvas").getContext("2d");
      let y = 800;

      if (!measurementContext) {
        throw new Error("Pengukuran teks untuk tata letak CV tidak tersedia.");
      }

      const pdfSafeText = (value) => String(value)
        .replace(/[–—]/g, "-")
        .replace(/[’‘]/g, "'")
        .replace(/[“”]/g, '"')
        .replace(/·/g, "|")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[^\x20-\x7E]/g, "");
      const escapeText = (value) => pdfSafeText(value).replace(/([\\()])/g, "\\$1");
      const writeText = (text, x, baseline, font, size, color, align = "left", wordSpacing = 0) => {
        const safeText = pdfSafeText(text);
        measurementContext.font = `${font === "F2" ? "bold " : ""}100px "Times New Roman"`;
        const measuredWidth = measurementContext.measureText(safeText).width * size / 100;
        const alignedX = align === "center" ? (pageWidth - measuredWidth) / 2 : x;
        commands.push(`${color[0]} ${color[1]} ${color[2]} rg BT /${font} ${size} Tf ${wordSpacing.toFixed(3)} Tw 1 0 0 1 ${alignedX.toFixed(2)} ${baseline} Tm (${escapeText(safeText)}) Tj ET`);
      };
      const wrapText = (text, size, font, availableWidth) => {
        const words = pdfSafeText(text).split(/\s+/);
        const lines = [];
        let line = "";
        measurementContext.font = `${font === "F2" ? "bold " : ""}100px "Times New Roman"`;
        words.forEach((word) => {
          const candidate = line ? `${line} ${word}` : word;
          const candidateWidth = measurementContext.measureText(candidate).width * size / 100;
          if (candidateWidth > availableWidth && line) {
            lines.push(line);
            line = word;
          } else {
            line = candidate;
          }
        });
        if (line) lines.push(line);
        return lines;
      };
      const addSection = (title) => {
        y -= 7;
        writeText(title.toUpperCase(), left, y, "F2", 10, [0.06, 0.24, 0.36]);
        y -= 4;
        commands.push(`0.10 0.58 0.62 RG 0.8 w ${left} ${y} m ${right} ${y} l S`);
        y -= 14;
      };
      const addParagraph = (text, size = 9.2, leading = 11.5) => {
        const lines = wrapText(text, size, "F1", right - left);
        lines.forEach((line, index) => {
          const isLastLine = index === lines.length - 1;
          const wordCount = line.split(" ").length - 1;
          measurementContext.font = `100px "Times New Roman"`;
          const lineWidth = measurementContext.measureText(line).width * size / 100;
          const wordSpacing = !isLastLine && wordCount > 0
            ? Math.max(0, (right - left - lineWidth) / wordCount)
            : 0;
          writeText(line, left, y, "F1", size, [0.12, 0.15, 0.18], "left", wordSpacing);
          y -= leading;
        });
      };
      const addBullet = (text) => {
        const lines = wrapText(text, 9.2, "F1", right - left - 14);
        lines.forEach((line, index) => {
          const x = index === 0 ? left + 5 : left + 14;
          const bulletLine = index === 0 ? `- ${line}` : line;
          const availableWidth = right - x;
          const wordCount = bulletLine.split(" ").length - 1;
          measurementContext.font = `100px "Times New Roman"`;
          const lineWidth = measurementContext.measureText(bulletLine).width * 9.2 / 100;
          const wordSpacing = index < lines.length - 1 && wordCount > 0
            ? Math.max(0, (availableWidth - lineWidth) / wordCount)
            : 0;
          writeText(bulletLine, x, y, "F1", 9.2, [0.12, 0.15, 0.18], "left", wordSpacing);
          y -= 11.5;
        });
      };
      const addEntry = (title, detail) => {
        writeText(title, left, y, "F2", 9.4, [0.10, 0.14, 0.18]);
        y -= 11.5;
        if (detail) addParagraph(detail, 9.0, 11);
      };

      writeText("JEMELI, S.Tr.M.", left, y, "F2", 22, [0.04, 0.16, 0.25], "center");
      y -= 18;
      writeText("MANAJEMEN KEUANGAN SEKTOR PUBLIK", left, y, "F2", 9, [0.08, 0.39, 0.45], "center");
      y -= 15;
      writeText("Politeknik Negeri Lhokseumawe | IPK 3.59 / 4.00 | Cumlaude | 148 SKS", left, y, "F1", 9, [0.20, 0.23, 0.26], "center");
      y -= 13;
      writeText("WhatsApp: +62 822-1051-8976 | Email: jemaliseda@email.com", left, y, "F1", 8.8, [0.20, 0.23, 0.26], "center");
      y -= 12;
      writeText("LinkedIn: linkedin.com/in/jemeli-jem-672a98373", left, y, "F1", 8.8, [0.20, 0.23, 0.26], "center");
      y -= 4;
      commands.push(`0.04 0.16 0.25 RG 1.4 w ${left} ${y} m ${right} ${y} l S`);
      y -= 14;

      addSection("Ringkasan Profesional");
      addParagraph("Lulusan Sarjana Terapan Manajemen Keuangan Sektor Publik dengan pengalaman magang MBKM di PT Bank Tabungan Negara (Persero) Tbk, mencakup administrasi pembiayaan KPR dan dukungan layanan nasabah. Memiliki dasar dalam akuntansi pemerintahan, audit sektor publik, administrasi perbankan, serta analisis ekonometrika menggunakan EViews 12.");

      addSection("Pendidikan");
      addEntry("Politeknik Negeri Lhokseumawe | Sarjana Terapan Manajemen Keuangan Sektor Publik (S.Tr.M)", "IPK 3.59/4.00 | Predikat Cumlaude | 148 SKS | 8 semester");

      addSection("Pengalaman");
      addEntry("PT Bank Tabungan Negara (Persero) Tbk | Magang MBKM | Februari-Juli 2025", "Administrasi Pembiayaan | Februari-April 2025");
      addBullet("Memverifikasi kelengkapan dokumen kredit KPR, memeriksa progres fisik pembangunan perumahan, serta membantu pemeriksaan laporan dan digitalisasi dokumen.");
      addEntry("Dukungan Layanan Nasabah | April-Juli 2025", "");
      addBullet("Mendukung layanan nasabah dan pengarsipan dokumen, termasuk penyelesaian volume tinggi pembuatan buku rekening KIP Kuliah selama dua minggu.");

      addSection("Proyek dan Kegiatan");
      addEntry("Penelitian Tugas Akhir | Analisis Belanja Modal Infrastruktur Provinsi Aceh", "Menggunakan EViews 12 dan Fixed Effect Model untuk menganalisis hubungan DAU, DAK Fisik, dan DOK dengan realisasi belanja modal infrastruktur. Nilai tugas akhir: A.");
      addEntry("Produksi dan Pemasaran Produk Kewirausahaan | Bisnis Fest 2025", "Memproduksi, memamerkan, dan memasarkan MADU UTEUN ASEULI SEURAMOE MEKAH pada kegiatan kewirausahaan mahasiswa.");

      addSection("Kompetensi");
      addParagraph("Keuangan publik: APBD, APBDes, akuntansi pemerintahan, audit sektor publik, perpajakan | Perbankan: verifikasi KPR, laporan pemeriksaan akhir (LPA), layanan nasabah, digitalisasi dokumen | Riset: EViews 12, ekonometrika, regresi data panel | Administrasi: pengarsipan, komunikasi publik, manajemen risiko ISO 31000.", 9.0, 11);

      addSection("Sertifikasi dan Pelatihan");
      addParagraph("Certified Village Development Planner (2024) | Sertifikat Soft Skill SKKNI (2024) | Manajemen Risiko Berbasis ISO 31000:2018 (2025) | Fundamental Akuntansi (2025) | Essential Competencies for Office Administrators (2026).", 9.0, 11);

      if (y < 38 || y > pageHeight) {
        throw new Error("Konten CV ATS tidak muat dalam satu halaman A4.");
      }

      const stream = `${commands.join("\n")}\n`;
      const objects = [
        "<< /Type /Catalog /Pages 2 0 R >>",
        "<< /Type /Pages /Kids [3 0 R] /Count 1 >>",
        `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pageWidth} ${pageHeight}] /Resources << /Font << /F1 4 0 R /F2 5 0 R >> >> /Contents 6 0 R >>`,
        "<< /Type /Font /Subtype /Type1 /BaseFont /Times-Roman /Encoding /WinAnsiEncoding >>",
        "<< /Type /Font /Subtype /Type1 /BaseFont /Times-Bold /Encoding /WinAnsiEncoding >>",
        `<< /Length ${stream.length} >>\nstream\n${stream}endstream`
      ];
      let pdf = "%PDF-1.4\n";
      const offsets = [0];
      objects.forEach((object, index) => {
        offsets.push(pdf.length);
        pdf += `${index + 1} 0 obj\n${object}\nendobj\n`;
      });
      const xrefOffset = pdf.length;
      pdf += `xref\n0 ${objects.length + 1}\n0000000000 65535 f \n`;
      offsets.slice(1).forEach((offset) => {
        pdf += `${String(offset).padStart(10, "0")} 00000 n \n`;
      });
      pdf += `trailer\n<< /Size ${objects.length + 1} /Root 1 0 R >>\nstartxref\n${xrefOffset}\n%%EOF`;

      const url = URL.createObjectURL(new Blob([pdf], { type: "application/pdf" }));
      const link = document.createElement("a");
      link.href = url;
      link.download = "Jemeli-CV-ATS.pdf";
      document.body.appendChild(link);
      link.click();
      link.remove();
      window.setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function openInternshipPhotoDatabase() {
      return new Promise((resolve, reject) => {
        if (!window.indexedDB) {
          reject(new Error("Penyimpanan lokal tidak tersedia di browser ini."));
          return;
        }

        const request = window.indexedDB.open(INTERNSHIP_PHOTO_DB, 1);
        request.onupgradeneeded = () => {
          if (!request.result.objectStoreNames.contains(INTERNSHIP_PHOTO_STORE)) {
            request.result.createObjectStore(INTERNSHIP_PHOTO_STORE, { keyPath: "src" });
          }
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error || new Error("Database foto tidak dapat dibuka."));
      });
    }

    async function getSavedInternshipPhotos() {
      const database = await openInternshipPhotoDatabase();
      return new Promise((resolve, reject) => {
        const transaction = database.transaction(INTERNSHIP_PHOTO_STORE, "readonly");
        const request = transaction.objectStore(INTERNSHIP_PHOTO_STORE).getAll();
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error || new Error("Foto tersimpan tidak dapat dibaca."));
        transaction.oncomplete = () => database.close();
        transaction.onerror = () => {
          database.close();
          reject(transaction.error || new Error("Foto tersimpan tidak dapat dibaca."));
        };
      });
    }

    async function saveInternshipPhoto(src, file) {
      const database = await openInternshipPhotoDatabase();
      return new Promise((resolve, reject) => {
        const transaction = database.transaction(INTERNSHIP_PHOTO_STORE, "readwrite");
        transaction.objectStore(INTERNSHIP_PHOTO_STORE).put({ src, blob: file });
        transaction.oncomplete = () => {
          database.close();
          resolve();
        };
        transaction.onerror = () => {
          database.close();
          reject(transaction.error || new Error("Foto pengganti gagal disimpan."));
        };
        transaction.onabort = () => {
          database.close();
          reject(transaction.error || new Error("Penyimpanan foto pengganti dibatalkan."));
        };
      });
    }

    async function removeSavedInternshipPhoto(src) {
      const database = await openInternshipPhotoDatabase();
      return new Promise((resolve, reject) => {
        const transaction = database.transaction(INTERNSHIP_PHOTO_STORE, "readwrite");
        transaction.objectStore(INTERNSHIP_PHOTO_STORE).delete(src);
        transaction.oncomplete = () => {
          database.close();
          resolve();
        };
        transaction.onerror = () => {
          database.close();
          reject(transaction.error || new Error("Foto pengganti gagal dihapus."));
        };
        transaction.onabort = () => {
          database.close();
          reject(transaction.error || new Error("Pengembalian foto asli dibatalkan."));
        };
      });
    }

    // Interactive Blue Background Canvas
    function BlueBackgroundCanvas() {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animationFrameId;

        let width = (canvas.width = window.innerWidth);
        let height = (canvas.height = window.innerHeight);

        const handleResize = () => {
          if (!canvas) return;
          width = canvas.width = window.innerWidth;
          height = canvas.height = window.innerHeight;
        };
        window.addEventListener('resize', handleResize);

        const mouse = { x: width / 2, y: height / 2, radius: 180 };
        const handleMouseMove = (e) => {
          mouse.x = e.clientX;
          mouse.y = e.clientY;
        };
        window.addEventListener('mousemove', handleMouseMove);

        const particleCount = Math.min(Math.floor((width * height) / 12000), 75);
        const particles = [];

        class Particle {
          constructor() {
            this.x = Math.random() * width;
            this.y = Math.random() * height;
            this.vx = (Math.random() - 0.5) * 0.8;
            this.vy = (Math.random() - 0.5) * 0.8;
            this.size = Math.random() * 2 + 1;
            this.baseAlpha = Math.random() * 0.4 + 0.2;
            this.alpha = this.baseAlpha;
            this.color = Math.random() > 0.4 ? '#00f0ff' : '#3b82f6';
          }

          update() {
            this.x += this.vx;
            this.y += this.vy;

            if (this.x < 0 || this.x > width) this.vx *= -1;
            if (this.y < 0 || this.y > height) this.vy *= -1;

            const dx = mouse.x - this.x;
            const dy = mouse.y - this.y;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist < mouse.radius) {
              const force = (mouse.radius - dist) / mouse.radius;
              this.alpha = Math.min(1, this.baseAlpha + force * 0.8);
              this.x -= (dx / dist) * force * 1.5;
              this.y -= (dy / dist) * force * 1.5;
            } else {
              this.alpha = this.baseAlpha;
            }
          }

          draw() {
            ctx.save();
            ctx.globalAlpha = this.alpha;
            ctx.fillStyle = this.color;
            ctx.shadowBlur = 10;
            ctx.shadowColor = this.color;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          }
        }

        for (let i = 0; i < particleCount; i++) {
          particles.push(new Particle());
        }

        const render = () => {
          ctx.clearRect(0, 0, width, height);

          const grad = ctx.createRadialGradient(
            mouse.x || width / 2,
            mouse.y || height / 3,
            50,
            width / 2,
            height / 2,
            Math.max(width, height)
          );
          grad.addColorStop(0, '#0a192f');
          grad.addColorStop(0.4, '#06101e');
          grad.addColorStop(1, '#02050b');

          ctx.fillStyle = grad;
          ctx.fillRect(0, 0, width, height);

          // Subtle Grid
          ctx.strokeStyle = 'rgba(0, 240, 255, 0.035)';
          ctx.lineWidth = 1;
          const gridSize = 60;
          for (let x = 0; x < width; x += gridSize) {
            ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, height); ctx.stroke();
          }
          for (let y = 0; y < height; y += gridSize) {
            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(width, y); ctx.stroke();
          }

          // Connections
          for (let i = 0; i < particles.length; i++) {
            particles[i].update();
            particles[i].draw();

            for (let j = i + 1; j < particles.length; j++) {
              const dx = particles[i].x - particles[j].x;
              const dy = particles[i].y - particles[j].y;
              const dist = Math.sqrt(dx * dx + dy * dy);

              if (dist < 130) {
                ctx.save();
                ctx.globalAlpha = (1 - dist / 130) * 0.25;
                ctx.strokeStyle = '#00f0ff';
                ctx.lineWidth = 0.8;
                ctx.beginPath();
                ctx.moveTo(particles[i].x, particles[i].y);
                ctx.lineTo(particles[j].x, particles[j].y);
                ctx.stroke();
                ctx.restore();
              }
            }
          }

          animationFrameId = requestAnimationFrame(render);
        };

        render();

        return () => {
          window.removeEventListener('resize', handleResize);
          window.removeEventListener('mousemove', handleMouseMove);
          cancelAnimationFrame(animationFrameId);
        };
      }, []);

      return (

    function InternshipPhotoLightbox({ photo, onClose, triggerRef }) {
      const dialogRef = useRef(null);
      const closeButtonRef = useRef(null);

      useEffect(() => {
        closeButtonRef.current?.focus();
        const previousOverflow = document.body.style.overflow;

        const handleKeyDown = (event) => {
          if (event.key === 'Escape') {
            event.preventDefault();
            onClose();
          } else if (event.key === 'Tab') {
            const focusableElements = dialogRef.current?.querySelectorAll('button:not([disabled])');
            if (!focusableElements?.length) return;
            const firstElement = focusableElements[0];
            const lastElement = focusableElements[focusableElements.length - 1];
            if (event.shiftKey && document.activeElement === firstElement) {
              event.preventDefault();
              lastElement.focus();
            } else if (!event.shiftKey && document.activeElement === lastElement) {
              event.preventDefault();
              firstElement.focus();
            }
          }
        };

        document.body.style.overflow = 'hidden';
        window.addEventListener('keydown', handleKeyDown);
        return () => {
          document.body.style.overflow = previousOverflow;
          window.removeEventListener('keydown', handleKeyDown);
          if (triggerRef.current?.isConnected) triggerRef.current.focus();
        };
      }, [photo]);

      if (!photo) return null;

      return (
        <div
          className="fixed inset-0 z-[100] flex items-center justify-center bg-black/90 backdrop-blur-md p-4 sm:p-8"
          onClick={onClose}
        >
          <div
            ref={dialogRef}
            role="dialog"
            aria-modal="true"
            aria-labelledby="internship-photo-caption"
            className="relative w-full max-w-5xl rounded-2xl border border-cyan-400/40 bg-navy-950/95 p-3 sm:p-5 shadow-2xl shadow-cyan-950/40"
            onClick={(event) => event.stopPropagation()}
          >
            <button
              ref={closeButtonRef}
              type="button"
              onClick={onClose}
              aria-label="Tutup foto"
              className="absolute right-5 top-5 z-10 inline-flex h-11 w-11 items-center justify-center rounded-full border border-white/30 bg-black/70 text-xl font-bold text-white transition hover:bg-cyan-500 hover:text-navy-950 focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-cyan-300"
            >
              <span aria-hidden="true">×</span>
            </button>
            <img
              src={photo.src}
              alt={photo.alt}
              className="mx-auto max-h-[78vh] w-full rounded-xl object-contain"
            />
            <p id="internship-photo-caption" className="pt-3 text-center text-sm font-medium text-cyan-100">
              {photo.caption}
            </p>
          </div>
        </div>
      );

          if (cancelled || hasStarted) return;
          const voices = synthesizer.getVoices();

                    const first = focusable[0];
                    const last = focusable[focusable.length - 1];
                    if (event.shiftKey && document.activeElement === first) {
                      event.preventDefault();
                      last.focus();
                    } else if (!event.shiftKey && document.activeElement === last) {
                      event.preventDefault();
                      first.focus();
                    }
                  }
                }}
                className="relative flex max-h-full w-full max-w-6xl flex-col overflow-hidden rounded-2xl border border-cyan-300/25 bg-[#071426] shadow-[0_24px_100px_rgba(0,0,0,0.7)] sm:rounded-3xl"
              >
                <div className="pointer-events-none absolute -left-32 -top-40 h-96 w-96 rounded-full bg-cyan-400/10 blur-3xl" />
                <div className="pointer-events-none absolute -bottom-40 -right-20 h-96 w-96 rounded-full bg-blue-500/10 blur-3xl" />

                <header className="relative z-10 flex shrink-0 items-center justify-between border-b border-white/10 px-4 py-3 sm:px-6">
                  <div className="flex min-w-0 items-center gap-3">
                    <span className="flex h-9 w-9 shrink-0 items-center justify-center rounded-xl border border-cyan-300/25 bg-cyan-300/10 text-cyan-200">▶</span>
                    <div className="min-w-0">
                      <p className="truncate text-xs font-bold tracking-wide text-white sm:text-sm">JEMELI · VIDEO PRESENTASI</p>
                      <p className="text-[10px] text-slate-400 sm:text-xs">Ringkasan profil, pendidikan, pengalaman, dan karya</p>
                    </div>
                  </div>
                  <button
                    type="button"
                    autoFocus
                    onClick={toggleAmbientSound}
                    className="ml-3 inline-flex shrink-0 items-center gap-2 rounded-xl border border-white/10 bg-white/5 px-3 py-2 text-xs font-semibold text-slate-200 transition hover:border-rose-300/40 hover:bg-rose-400/10 hover:text-white"
                    aria-label="Tutup video presentasi dan matikan musik"
                  >
                    <span aria-hidden="true">×</span><span className="hidden sm:inline">Tutup</span>
                  </button>
                </header>

                {(() => {
                  const slide = videoPresentationSlides[videoPresentationSlide];
                  const progressPercent = Math.min(100, (videoSlideElapsed / slide.durationMs) * 100);
                  return (
                    <div className="relative z-10 h-1 shrink-0 bg-white/5" role="progressbar" aria-label={`Durasi bagian ${slide.eyebrow}`} aria-valuemin="0" aria-valuemax="100" aria-valuenow={Math.round(progressPercent)}>
                      <div className="h-full bg-gradient-to-r from-cyan-300 via-blue-400 to-indigo-400 transition-[width] duration-100" style={{ width: `${progressPercent}%` }} />
                      <span className="sr-only">{Math.ceil(slide.durationMs / 1000)} detik</span>
                    </div>
                  );
                })()}

                {(() => {
                  const slide = videoPresentationSlides[videoPresentationSlide];
                  const isEducationSlide = videoPresentationSlide === 1;
                  const isResearchSlide = videoPresentationSlide === 3;
                  const isInternshipSlide = slide.kind === "internship-gallery";
                  const isActivitySlide = slide.kind === "activity-gallery";
                  const isCredentialSlide = slide.kind === "credentials";
                  const mediaItems = isInternshipSlide
                    ? INTERNSHIP_PHOTOS.map((photo) => ({
                        src: internshipPhotoOverrides[photo.src] || photo.src,
                        alt: photo.alt,
                        caption: photo.caption
                      }))
                    : isActivitySlide
                      ? CAMPUS_ACTIVITY_PHOTOS
                      : [];
                  const activeMedia = mediaItems[videoPresentationMediaIndex] || null;
                  const credential = isCredentialSlide ? certList[videoPresentationMediaIndex] : null;
                  const isGalleryCollage = (isInternshipSlide || isActivitySlide)
                    && videoSlideElapsed >= slide.durationMs - galleryCollageDurationMs;
                  return (
                    <div key={videoPresentationSlide} className="relative z-10 grid min-h-0 flex-1 overflow-y-auto lg:grid-cols-[1.05fr_0.95fr]">
                      <div className="presentation-text-in relative min-h-[230px] overflow-hidden bg-slate-950 sm:min-h-[320px] lg:min-h-0">
                        <img
                          key={activeMedia ? `${activeMedia.src}-${videoPresentationMediaIndex}` : slide.image}
                          src={activeMedia ? activeMedia.src : slide.image}
                          alt={activeMedia ? activeMedia.alt : slide.imageAlt}
                          className={`${activeMedia ? "presentation-gallery-photo-in" : "presentation-photo-drift"} absolute inset-0 h-full w-full object-cover ${videoPresentationSlide === 0 || slide.kind === "professional-focus" ? "object-top" : "object-center"}`}
                        />
                        <div className="absolute inset-0 bg-gradient-to-t from-[#06101f] via-[#06101f]/15 to-[#06101f]/10 lg:bg-gradient-to-r lg:from-transparent lg:via-[#06101f]/10 lg:to-[#071426]" />
                        {isGalleryCollage && (
                          <div className="absolute inset-0 z-20 flex flex-col bg-[#06101f]/95 p-3 backdrop-blur-sm sm:p-5">
                            <div className="mb-2 flex items-center justify-between gap-2 sm:mb-3">
                              <p className="text-[10px] font-bold uppercase tracking-[0.18em] text-cyan-100 sm:text-xs">Rangkuman dokumentasi</p>
                              <span className="rounded-full border border-white/15 bg-white/5 px-2 py-1 text-[9px] text-slate-300">{mediaItems.length} foto</span>
                            </div>
                            <div className="grid min-h-0 flex-1 grid-cols-3 grid-rows-3 gap-1.5 sm:gap-2">
                              {mediaItems.map((media, index) => (
                                <div
                                  key={`${media.src}-${index}`}
                                  className="presentation-collage-tile-in relative min-h-0 overflow-hidden rounded-lg border border-white/15 bg-slate-900 shadow-lg"
                                  style={{ animationDelay: `${index * 65}ms`, "--tile-rotation": `${index % 2 === 0 ? -4 : 4}deg` }}
                                >
                                  <img src={media.src} alt={media.alt} className="h-full w-full object-cover" />
                                  <span className="absolute bottom-1 right-1 rounded bg-black/65 px-1.5 py-0.5 text-[8px] font-semibold text-white/90">{String(index + 1).padStart(2, "0")}</span>
                                </div>
                              ))}
                            </div>
                          </div>
                        )}
                        <div className="absolute inset-x-0 bottom-0 p-4 sm:p-6 lg:hidden">
                          <span className="inline-flex items-center gap-2 rounded-full border border-white/20 bg-black/35 px-3 py-1 text-[10px] font-semibold uppercase tracking-[0.18em] text-cyan-100 backdrop-blur">
                            <span className="h-1.5 w-1.5 rounded-full bg-cyan-300 shadow-[0_0_12px_#67e8f9]" />
                            {slide.eyebrow}
                          </span>
                        </div>
                        <div className="absolute left-5 top-5 hidden rounded-full border border-white/15 bg-black/30 px-3 py-1.5 text-[10px] font-semibold uppercase tracking-[0.18em] text-cyan-100 backdrop-blur lg:inline-flex">
                          {slide.eyebrow}
                        </div>
                        {activeMedia && (
                          <>
                            <div className="absolute inset-x-0 bottom-0 bg-gradient-to-t from-[#04101f] via-[#04101f]/90 to-transparent px-4 pb-4 pt-14 sm:px-6 sm:pb-6">
                              <p className="line-clamp-2 text-xs font-semibold leading-relaxed text-white sm:text-sm">{activeMedia.caption}</p>
                              <p className="mt-1.5 text-[9px] font-medium uppercase tracking-wider text-cyan-100/70 sm:text-[10px]">
                                Dokumentasi {videoPresentationMediaIndex + 1} dari {mediaItems.length}
                              </p>
                            </div>
                            <button
                              type="button"
                              onClick={() => setVideoPresentationMediaIndex((index) => (index - 1 + mediaItems.length) % mediaItems.length)}
                              className="absolute left-3 top-1/2 flex h-9 w-9 -translate-y-1/2 items-center justify-center rounded-full border border-white/25 bg-black/40 text-lg text-white backdrop-blur transition hover:bg-black/70"
                              aria-label="Foto sebelumnya"
                            >‹</button>
                            <button
                              type="button"
                              onClick={() => setVideoPresentationMediaIndex((index) => (index + 1) % mediaItems.length)}
                              className="absolute right-3 top-1/2 flex h-9 w-9 -translate-y-1/2 items-center justify-center rounded-full border border-white/25 bg-black/40 text-lg text-white backdrop-blur transition hover:bg-black/70"
                              aria-label="Foto berikutnya"
                            >›</button>
                          </>
                        )}
                        <div className="absolute bottom-6 left-6 hidden max-w-xs lg:block">
                          {!activeMedia && (
                            <>
                              <p className="text-xs font-semibold tracking-[0.22em] text-white/75">JEMELI, S.Tr.M</p>
                              <div className="mt-2 h-0.5 w-20 bg-gradient-to-r from-cyan-300 to-transparent" />
                            </>
                          )}
                        </div>
                      </div>

                      <div className="relative flex flex-col justify-center p-5 sm:p-8 lg:p-10 xl:p-12">
                        <div className="presentation-text-in" style={{ animationDelay: "100ms" }}>
                          <p className="hidden text-[10px] font-bold uppercase tracking-[0.24em] text-cyan-300 lg:block">{slide.eyebrow}</p>
                          <h2 className="mt-1 text-2xl font-black leading-tight tracking-tight text-white sm:text-3xl lg:mt-3 lg:text-4xl xl:text-[2.75rem]">
                            {slide.title}
                          </h2>
                          <p className="mt-2 max-w-xl text-sm font-medium leading-relaxed text-cyan-100/80 sm:text-base">{slide.subtitle}</p>
                          <p lang={narrationLanguage} aria-live="polite" className="mt-4 max-w-xl border-l-2 border-cyan-300/60 pl-3 text-xs leading-relaxed text-slate-300 sm:mt-5 sm:text-sm">
                            {slide.narration[narrationLanguage]}
                          </p>
                        </div>

                        <div className="mt-5 h-px w-full bg-gradient-to-r from-cyan-300/70 via-blue-400/25 to-transparent sm:mt-7" />
                        <ul className="mt-5 space-y-3 sm:mt-6 sm:space-y-4">
                          {slide.details.map((detail, index) => (
                            <li
                              key={detail}
                              className="presentation-text-in flex items-start gap-3 text-xs leading-relaxed text-slate-200 sm:text-sm"
                              style={{ animationDelay: `${220 + index * 140}ms` }}
                            >
                              <span className="mt-0.5 flex h-5 w-5 shrink-0 items-center justify-center rounded-full border border-cyan-300/30 bg-cyan-300/10 text-[10px] font-bold text-cyan-200">
                                {String(index + 1).padStart(2, "0")}
                              </span>
                              <span>{detail}</span>
                            </li>
                          ))}
                        </ul>

                        {isEducationSlide && (
                          <div className="mt-6 grid grid-cols-3 gap-2 sm:mt-8 sm:gap-3">
                            {[["3,59", "IPK"], ["148", "SKS"], ["8", "Semester"]].map(([value, label], index) => (
                              <div key={label} className="presentation-text-in rounded-xl border border-white/10 bg-white/[0.04] p-3 sm:p-4" style={{ animationDelay: `${520 + index * 120}ms` }}>
                                <p className="text-lg font-black text-white sm:text-2xl">{value}</p>
                                <p className="mt-0.5 text-[9px] font-bold uppercase tracking-wider text-cyan-200/70 sm:text-[10px]">{label}</p>
                              </div>
                            ))}
                          </div>
                        )}

                        {isInternshipSlide && (
                          <div className="presentation-text-in mt-6 rounded-xl border border-blue-300/15 bg-blue-300/[0.05] p-4 sm:mt-8" style={{ animationDelay: "620ms" }}>
                            <div className="flex items-center justify-between gap-3 text-[10px] font-semibold text-blue-100 sm:text-xs">
                              <span>FEB 2025</span><span className="h-px flex-1 bg-gradient-to-r from-blue-300/20 via-blue-300 to-blue-300/20" /><span>JUL 2025</span>
                            </div>
                            <div className="mt-3 flex flex-wrap gap-1.5">
                              {["Administrasi pembiayaan KPR", "Layanan nasabah", "Dokumentasi lapangan"].map((skill) => (
                                <span key={skill} className="rounded-full border border-blue-200/15 bg-blue-200/[0.05] px-2.5 py-1 text-[9px] text-blue-100/80">{skill}</span>
                              ))}
                            </div>
                            <p className="mt-3 text-[10px] leading-relaxed text-slate-400 sm:text-xs">Ringkasan tugas magang; dokumentasi ini tidak menampilkan data nasabah atau berkas internal.</p>
                          </div>
                        )}

                        {isResearchSlide && (
                          <div className="presentation-text-in mt-6 space-y-3 rounded-xl border border-indigo-300/15 bg-indigo-300/[0.05] p-4 sm:mt-8" style={{ animationDelay: "620ms" }}>
                            <div className="flex items-center justify-between text-[10px] text-slate-300 sm:text-xs">
                              <span>DAU</span><span className="font-mono text-rose-200">−0,235</span>
                            </div>
                            <div className="h-1.5 overflow-hidden rounded-full bg-white/10"><div className="presentation-bar-in h-full w-[38%] rounded-full bg-rose-300" /></div>
                            <div className="flex items-center justify-between text-[10px] text-slate-300 sm:text-xs">
                              <span>DAK Fisik</span><span className="font-mono text-cyan-200">+0,721</span>
                            </div>
                            <div className="h-1.5 overflow-hidden rounded-full bg-white/10"><div className="presentation-bar-in h-full w-[78%] rounded-full bg-cyan-300" style={{ animationDelay: "300ms" }} /></div>
                            <div className="flex items-center justify-between text-[10px] text-slate-300 sm:text-xs">
                              <span>DOK</span><span className="font-mono text-blue-200">+0,579</span>
                            </div>
                            <div className="h-1.5 overflow-hidden rounded-full bg-white/10"><div className="presentation-bar-in h-full w-[62%] rounded-full bg-blue-300" style={{ animationDelay: "450ms" }} /></div>
                            <p className="pt-1 text-[9px] leading-relaxed text-slate-500 sm:text-[10px]">Koefisien FEM dari tugas akhir; visualisasi ringkas, bukan perbandingan skala satuan.</p>
                          </div>
                        )}

                        {isActivitySlide && (
                          <div className="presentation-text-in mt-6 flex flex-wrap gap-2 sm:mt-8" style={{ animationDelay: "620ms" }}>
                            {["Komunikasi", "Promosi produk", "Pelayanan pengunjung", "Kerja tim"].map((skill, index) => (
                              <span key={skill} className="rounded-full border border-emerald-300/20 bg-emerald-300/[0.06] px-3 py-1.5 text-[10px] font-medium text-emerald-100/90 sm:text-xs" style={{ animationDelay: `${700 + index * 100}ms` }}>{skill}</span>
                            ))}
                          </div>
                        )}

                        {isCredentialSlide && credential && (
                          <article key={credential.title} className="presentation-text-in mt-5 rounded-2xl border border-amber-200/20 bg-gradient-to-br from-amber-100/[0.08] via-white/[0.03] to-transparent p-4 sm:mt-7 sm:p-5">
                            <div className="flex items-start justify-between gap-3">
                              <div>
                                <span className="inline-flex rounded-full border border-amber-200/20 bg-amber-200/[0.08] px-2.5 py-1 text-[9px] font-semibold uppercase tracking-wider text-amber-100/90">
                                  {credential.category === "training" ? "Pelatihan" : "Sertifikasi"} · {credential.year}
                                </span>
                                <h3 className="mt-3 text-base font-bold leading-snug text-white sm:text-lg">{credential.title}</h3>
                                <p className="mt-1 text-[10px] leading-relaxed text-slate-400 sm:text-xs">{credential.issuer}</p>
                              </div>
                              <span className="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl border border-amber-200/15 bg-amber-100/[0.06] text-lg text-amber-100" aria-hidden="true">✦</span>
                            </div>
                            <p className="mt-4 text-[9px] font-semibold uppercase tracking-wider text-slate-400 sm:text-[10px]">Materi kompetensi yang tercatat</p>
                            <ul className="mt-2 space-y-1.5">
                              {credential.skills.map((skill) => (
                                <li key={skill} className="flex items-start gap-2 text-[10px] leading-relaxed text-slate-200 sm:text-xs">
                                  <span className="text-amber-200" aria-hidden="true">✓</span><span>{skill}</span>
                                </li>
                              ))}
                            </ul>
                            <a href={credential.file} target="_blank" rel="noopener noreferrer" className="mt-4 inline-flex items-center gap-2 rounded-lg border border-amber-200/20 px-3 py-2 text-[10px] font-semibold text-amber-100 transition hover:bg-amber-100/10 sm:text-xs">
                              Buka dokumen sertifikat ↗
                            </a>
                          </article>
                        )}

                        {slide.kind === "professional-focus" && (
                          <a href={LINKEDIN_URL} target="_blank" rel="noopener noreferrer" className="presentation-text-in mt-6 inline-flex w-fit items-center gap-2 rounded-xl bg-gradient-to-r from-cyan-300 to-blue-400 px-4 py-3 text-xs font-extrabold text-slate-950 shadow-lg shadow-cyan-950/30 transition hover:brightness-110 sm:mt-8" style={{ animationDelay: "620ms" }}>
                            Terhubung di LinkedIn <span aria-hidden="true">↗</span>
                          </a>
                        )}

                        <div className="mt-6 flex items-center justify-between border-t border-white/10 pt-4 text-[10px] text-slate-500 sm:mt-8">
                          <span>{Math.floor(slide.durationMs / 1000)} detik · Musik: MUSIC4VIDEO</span>
                          <span>{String(videoPresentationSlide + 1).padStart(2, "0")} / {String(videoPresentationSlides.length).padStart(2, "0")}</span>
                        </div>
                      </div>
                    </div>
                  );
                })()}

                <footer className="relative z-10 flex shrink-0 flex-wrap items-center justify-between gap-3 border-t border-white/10 bg-black/10 px-4 py-3 sm:px-6">
                  <div className="flex w-full flex-wrap items-center justify-between gap-3">
                    <div className="flex items-center gap-2">
                      <label htmlFor="presentation-narration-language" className="text-[10px] font-semibold uppercase tracking-wider text-slate-400">Narasi</label>
                      <select
                        id="presentation-narration-language"
                        value={narrationLanguage}
                        onChange={(event) => setNarrationLanguage(event.target.value)}
                        className="max-w-40 rounded-lg border border-white/10 bg-[#0b1a2d] px-2.5 py-2 text-xs text-slate-100 outline-none transition focus:border-cyan-300/50"
                      >
                        {narrationLanguages.map((language) => <option key={language.code} value={language.code}>{language.label}</option>)}
                      </select>
                      <button
                        type="button"
                        onClick={() => {
                          const nextEnabled = !isNarrationEnabled;
                          setIsNarrationEnabled(nextEnabled);
                          if (window.speechSynthesis) {
                            if (nextEnabled) window.speechSynthesis.resume();
                            else window.speechSynthesis.cancel();
                          }
                        }}
                        aria-pressed={isNarrationEnabled}
                        className={`rounded-lg border px-2.5 py-2 text-[10px] font-semibold transition sm:text-xs ${isNarrationEnabled ? "border-cyan-300/25 bg-cyan-300/10 text-cyan-100" : "border-white/10 text-slate-400 hover:bg-white/5"}`}
                      >
                        Voice {isNarrationEnabled ? "Nyala" : "Mati"}
                      </button>
                    </div>
                    <div className="flex items-center gap-1.5">
                      {videoPresentationSlides.map((slide, index) => (
                        <button
                          key={slide.eyebrow}
                          type="button"
                          onClick={() => changeVideoPresentationSlide(index)}
                          aria-label={`Tampilkan bagian ${index + 1}: ${slide.eyebrow}`}
                          aria-current={videoPresentationSlide === index ? "step" : undefined}
                          className={`h-1.5 rounded-full transition-all duration-300 ${videoPresentationSlide === index ? "w-8 bg-cyan-300 shadow-[0_0_12px_rgba(103,232,249,0.6)]" : "w-3 bg-slate-600 hover:bg-slate-400"}`}
                        />
                      ))}
                    </div>
                  </div>
                  <div className="flex w-full flex-wrap items-center justify-between gap-2">
                    <p role="status" aria-live="polite" className="min-h-4 max-w-[55%] text-[9px] leading-relaxed text-amber-200/80 sm:text-[10px]">
                      {narrationError || `${Math.floor(videoPresentationSlides[videoPresentationSlide].durationMs / 1000)} detik per bagian${videoPresentationSlides[videoPresentationSlide].kind === "internship-gallery" ? ` · dokumentasi ${videoPresentationMediaIndex + 1} dari ${INTERNSHIP_PHOTOS.length}` : videoPresentationSlides[videoPresentationSlide].kind === "activity-gallery" ? ` · dokumentasi ${videoPresentationMediaIndex + 1} dari ${CAMPUS_ACTIVITY_PHOTOS.length}` : videoPresentationSlides[videoPresentationSlide].kind === "credentials" ? ` · capaian ${videoPresentationMediaIndex + 1} dari ${certList.length}` : ""}`}
                    </p>
                    <div className="flex items-center gap-2">
                      <button type="button" onClick={() => changeVideoPresentationSlide(videoPresentationSlide - 1)} className="rounded-lg border border-white/10 px-3 py-2 text-xs font-semibold text-slate-300 transition hover:bg-white/10" aria-label="Bagian sebelumnya">← <span className="hidden sm:inline">Sebelumnya</span></button>
                      <button
                        type="button"
                        onClick={() => {
                          const nextPlaying = !isVideoPresentationPlaying;
                          setIsVideoPresentationPlaying(nextPlaying);
                          if (window.speechSynthesis) {
                            if (nextPlaying) window.speechSynthesis.resume();
                            else window.speechSynthesis.pause();
                          }
                        }}
                        className="min-w-20 rounded-lg border border-cyan-300/20 bg-cyan-300/10 px-3 py-2 text-xs font-semibold text-cyan-100 transition hover:bg-cyan-300/20"
                      >
                        {isVideoPresentationPlaying ? "Jeda" : "Lanjut"}
                      </button>
                      <button type="button" onClick={() => changeVideoPresentationSlide(videoPresentationSlide + 1)} className="rounded-lg border border-white/10 px-3 py-2 text-xs font-semibold text-slate-300 transition hover:bg-white/10" aria-label="Bagian berikutnya"><span className="hidden sm:inline">Berikutnya</span> →</button>
                    </div>
                  </div>
                </footer>
              </section>
            </div>
          )}

          {isStoryLetterOpen && (
            <StoryLetterModal
              onClose={closeStoryLetter}
              isMusicPlaying={isStoryAudioPlaying}
              musicError={storyAudioError}
              onToggleMusic={toggleStoryAudio}
            />
          )}
          <CertModal cert={selectedCert} onClose={() => setSelectedCert(null)} />
          {selectedInternshipPhoto && (
            <InternshipPhotoLightbox
              photo={selectedInternshipPhoto}
              onClose={() => setSelectedInternshipPhoto(null)}
              triggerRef={internshipPhotoTriggerRef}
            />
          )}
          {selectedEducationCertificate && (
            <InternshipPhotoLightbox
              photo={selectedEducationCertificate}
              onClose={() => setSelectedEducationCertificate(null)}
              triggerRef={educationCertificateTriggerRef}
            />
          )}

          <footer className="glass-panel border-t border-cyan-500/20 py-6 text-center text-xs text-slate-400 no-print">
            <p>© 2026 JEMELI, S.Tr.M — Politeknik Negeri Lhokseumawe.</p>
            <p className="mt-2">Musik: “Inspiring Background Music” oleh MUSIC4VIDEO.</p>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
