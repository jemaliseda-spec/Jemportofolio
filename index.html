    function openInternshipPhotoDatabase() {
      return new Promise((resolve, reject) => {
        if (!window.indexedDB) {
          reject(new Error("Penyimpanan lokal tidak tersedia di browser ini."));
          return;
        }

        const request = window.indexedDB.open(INTERNSHIP_PHOTO_DB, 1);
        request.onupgradeneeded = () => {
          if (!request.result.objectStoreNames.contains(INTERNSHIP_PHOTO_STORE)) {
            request.result.createObjectStore(INTERNSHIP_PHOTO_STORE, { keyPath: "src" });
          }
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error || new Error("Database foto tidak dapat dibuka."));
      });
    }

    async function getSavedInternshipPhotos() {
      const database = await openInternshipPhotoDatabase();
      return new Promise((resolve, reject) => {
        const transaction = database.transaction(INTERNSHIP_PHOTO_STORE, "readonly");
        const request = transaction.objectStore(INTERNSHIP_PHOTO_STORE).getAll();
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error || new Error("Foto tersimpan tidak dapat dibaca."));
        transaction.oncomplete = () => database.close();
        transaction.onerror = () => {
          database.close();
          reject(transaction.error || new Error("Foto tersimpan tidak dapat dibaca."));
        };
      });
    }

    async function saveInternshipPhoto(src, file) {
      const database = await openInternshipPhotoDatabase();
      return new Promise((resolve, reject) => {
        const transaction = database.transaction(INTERNSHIP_PHOTO_STORE, "readwrite");
        transaction.objectStore(INTERNSHIP_PHOTO_STORE).put({ src, blob: file });
        transaction.oncomplete = () => {
          database.close();
          resolve();
        };
        transaction.onerror = () => {
          database.close();
          reject(transaction.error || new Error("Foto pengganti gagal disimpan."));
        };
        transaction.onabort = () => {
          database.close();
          reject(transaction.error || new Error("Penyimpanan foto pengganti dibatalkan."));
        };
      });
    }

    // Interactive Blue Background Canvas
    function BlueBackgroundCanvas() {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animationFrameId;

        let width = (canvas.width = window.innerWidth);
        let height = (canvas.height = window.innerHeight);

        const handleResize = () => {
          if (!canvas) return;
          width = canvas.width = window.innerWidth;
          height = canvas.height = window.innerHeight;
        };
        window.addEventListener('resize', handleResize);

        const mouse = { x: width / 2, y: height / 2, radius: 180 };
        const handleMouseMove = (e) => {
          mouse.x = e.clientX;
          mouse.y = e.clientY;
        };
        window.addEventListener('mousemove', handleMouseMove);

        const particleCount = Math.min(Math.floor((width * height) / 12000), 75);
        const particles = [];

        class Particle {
          constructor() {
            this.x = Math.random() * width;
            this.y = Math.random() * height;
            this.vx = (Math.random() - 0.5) * 0.8;
            this.vy = (Math.random() - 0.5) * 0.8;
            this.size = Math.random() * 2 + 1;
            this.baseAlpha = Math.random() * 0.4 + 0.2;
            this.alpha = this.baseAlpha;
            this.color = Math.random() > 0.4 ? '#00f0ff' : '#3b82f6';
          }

          update() {
            this.x += this.vx;
            this.y += this.vy;

            if (this.x < 0 || this.x > width) this.vx *= -1;
            if (this.y < 0 || this.y > height) this.vy *= -1;

            const dx = mouse.x - this.x;
            const dy = mouse.y - this.y;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist < mouse.radius) {
              const force = (mouse.radius - dist) / mouse.radius;
              this.alpha = Math.min(1, this.baseAlpha + force * 0.8);
              this.x -= (dx / dist) * force * 1.5;
              this.y -= (dy / dist) * force * 1.5;
            } else {
              this.alpha = this.baseAlpha;
            }
          }

          draw() {
            ctx.save();
            ctx.globalAlpha = this.alpha;
            ctx.fillStyle = this.color;
            ctx.shadowBlur = 10;
            ctx.shadowColor = this.color;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          }
        }

        for (let i = 0; i < particleCount; i++) {
          particles.push(new Particle());
        }

        const render = () => {
          ctx.clearRect(0, 0, width, height);

          const grad = ctx.createRadialGradient(
            mouse.x || width / 2,
            mouse.y || height / 3,
            50,
            width / 2,
            height / 2,
            Math.max(width, height)
          );
          grad.addColorStop(0, '#0a192f');
          grad.addColorStop(0.4, '#06101e');
          grad.addColorStop(1, '#02050b');

          ctx.fillStyle = grad;
          ctx.fillRect(0, 0, width, height);

          // Subtle Grid
          ctx.strokeStyle = 'rgba(0, 240, 255, 0.035)';
          ctx.lineWidth = 1;
          const gridSize = 60;
          for (let x = 0; x < width; x += gridSize) {
            ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, height); ctx.stroke();
          }
          for (let y = 0; y < height; y += gridSize) {
            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(width, y); ctx.stroke();
          }

          // Connections
          for (let i = 0; i < particles.length; i++) {
            particles[i].update();
            particles[i].draw();

            for (let j = i + 1; j < particles.length; j++) {
              const dx = particles[i].x - particles[j].x;
              const dy = particles[i].y - particles[j].y;
              const dist = Math.sqrt(dx * dx + dy * dy);

              if (dist < 130) {
                ctx.save();
                ctx.globalAlpha = (1 - dist / 130) * 0.25;
                ctx.strokeStyle = '#00f0ff';
                ctx.lineWidth = 0.8;
                ctx.beginPath();
                ctx.moveTo(particles[i].x, particles[i].y);
                ctx.lineTo(particles[j].x, particles[j].y);
                ctx.stroke();
                ctx.restore();
              }
            }
          }

          animationFrameId = requestAnimationFrame(render);
        };

        render();

        return () => {
          window.removeEventListener('resize', handleResize);
          window.removeEventListener('mousemove', handleMouseMove);
          cancelAnimationFrame(animationFrameId);
        };
      }, []);

      return (
        <canvas
          ref={canvasRef}
          className="fixed inset-0 pointer-events-none z-0"
          style={{ width: '100vw', height: '100vh' }}
        />
      );
    }

    function InternshipPhotoLightbox({ photo, onClose, triggerRef }) {
      const dialogRef = useRef(null);
      const closeButtonRef = useRef(null);

      useEffect(() => {
        closeButtonRef.current?.focus();
        const previousOverflow = document.body.style.overflow;

        const handleKeyDown = (event) => {
          if (event.key === 'Escape') {
            event.preventDefault();
            onClose();
          } else if (event.key === 'Tab') {
            const focusableElements = dialogRef.current?.querySelectorAll('button:not([disabled])');
            if (!focusableElements?.length) return;
            const firstElement = focusableElements[0];
            const lastElement = focusableElements[focusableElements.length - 1];
            if (event.shiftKey && document.activeElement === firstElement) {
              event.preventDefault();
              lastElement.focus();
            } else if (!event.shiftKey && document.activeElement === lastElement) {
              event.preventDefault();
              firstElement.focus();
            }
          }
        };

        document.body.style.overflow = 'hidden';
        window.addEventListener('keydown', handleKeyDown);
        return () => {
          document.body.style.overflow = previousOverflow;
          window.removeEventListener('keydown', handleKeyDown);
          if (triggerRef.current?.isConnected) triggerRef.current.focus();
        };
      }, [photo]);

      if (!photo) return null;

      return (
        <div
          className="fixed inset-0 z-[100] flex items-center justify-center bg-black/90 backdrop-blur-md p-4 sm:p-8"
          onClick={onClose}

          <div

            className="relative w-full max-w-5xl rounded-2xl border border-cyan-400/40 bg-navy-950/95 p-3 sm:p-5 shadow-2xl shadow-cyan-950/40"

    // Main App Component
    function App() {
      const [viewMode, setViewMode] = useState('slides'); // 'slides' | 'landing'
      const [currentSlide, setCurrentSlide] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const [selectedCert, setSelectedCert] = useState(null);
      const [activeCredentialCategory, setActiveCredentialCategory] = useState("certification");
      const [selectedInternshipPhoto, setSelectedInternshipPhoto] = useState(null);
      const [internshipPhotoOverrides, setInternshipPhotoOverrides] = useState({});
      const [isManagingInternshipPhotos, setIsManagingInternshipPhotos] = useState(false);
      const [internshipPhotoMessage, setInternshipPhotoMessage] = useState("");
      const [internshipPhotoMessageIsError, setInternshipPhotoMessageIsError] = useState(false);
      const [isMusicPlaying, setIsMusicPlaying] = useState(true);

      const totalSlides = 9;
      const audioRef = useRef(null);
      const internshipPhotoTriggerRef = useRef(null);
      const internshipPhotoUrlsRef = useRef(new Set());
      const internshipPhotoOverrideUrlsRef = useRef({});
      const internshipPhotoEditsRef = useRef(new Set());

      const nextSlide = () => setCurrentSlide((prev) => (prev + 1) % totalSlides);
      const prevSlide = () => setCurrentSlide((prev) => (prev - 1 + totalSlides) % totalSlides);

      useEffect(() => {
        let interval = null;
        if (isPlaying) {
          interval = setInterval(nextSlide, 6000);
        }
        return () => clearInterval(interval);
      }, [isPlaying]);

      const toggleMusic = () => {
        if (audioRef.current) {
          if (isMusicPlaying) {
            audioRef.current.pause();
            setIsMusicPlaying(false);
          } else {
            audioRef.current.play().then(() => setIsMusicPlaying(true)).catch(() => {});
          }
        }
      };

      useEffect(() => {
        const playAudio = () => {
          if (audioRef.current) {
            audioRef.current.play().then(() => setIsMusicPlaying(true)).catch(() => {});
          }
        };
        window.addEventListener('click', playAudio, { once: true });
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, []);

      useEffect(() => {
        const handleKeyDown = (e) => {
          if (viewMode !== 'slides' || selectedInternshipPhoto) return;
          if (e.key === 'ArrowRight' || e.key === ' ') {
            e.preventDefault(); nextSlide();
          } else if (e.key === 'ArrowLeft') {
            e.preventDefault(); prevSlide();
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [viewMode, selectedInternshipPhoto]);

      useEffect(() => {
        if (currentSlide !== 3 || viewMode !== 'slides') {
          setSelectedInternshipPhoto(null);
        }
      }, [currentSlide, viewMode]);

      useEffect(() => {
        let isActive = true;
        getSavedInternshipPhotos().then((savedPhotos) => {
          const overrides = {};
          savedPhotos.forEach(({ src, blob }) => {
            if (internshipPhotoEditsRef.current.has(src)) return;
            const url = URL.createObjectURL(blob);
            internshipPhotoUrlsRef.current.add(url);
            overrides[src] = url;
          });
          if (isActive) {
            Object.entries(internshipPhotoOverrideUrlsRef.current).forEach(([src, url]) => {
              overrides[src] = url;
            });
            internshipPhotoOverrideUrlsRef.current = overrides;
            setInternshipPhotoOverrides(overrides);
          } else {
            Object.values(overrides).forEach((url) => URL.revokeObjectURL(url));
          }
        }).catch((error) => {
          console.error("Gagal memuat foto galeri tersimpan:", error);
          if (isActive) {
            setInternshipPhotoMessage(error.message || "Foto galeri tersimpan tidak dapat dimuat.");
            setInternshipPhotoMessageIsError(true);
          }
        });

        return () => {
          isActive = false;
          internshipPhotoUrlsRef.current.forEach((url) => URL.revokeObjectURL(url));
          internshipPhotoUrlsRef.current.clear();
          internshipPhotoOverrideUrlsRef.current = {};
          internshipPhotoEditsRef.current.clear();
        };
      }, []);

      const handleInternshipPhotoUpload = async (photo, file) => {
        if (!file.type.startsWith("image/")) {
          setInternshipPhotoMessage("Pilih file gambar dengan format yang didukung.");
          setInternshipPhotoMessageIsError(true);
          return;
        }
        if (file.size > 20 * 1024 * 1024) {
          setInternshipPhotoMessage("Ukuran gambar maksimal 20 MB.");
          setInternshipPhotoMessageIsError(true);
          return;
        }

        try {
          await saveInternshipPhoto(photo.src, file);
          internshipPhotoEditsRef.current.add(photo.src);
          const url = URL.createObjectURL(file);
          const previousUrl = internshipPhotoOverrideUrlsRef.current[photo.src];
          if (previousUrl) {
            URL.revokeObjectURL(previousUrl);
            internshipPhotoUrlsRef.current.delete(previousUrl);
          }
          internshipPhotoUrlsRef.current.add(url);
          internshipPhotoOverrideUrlsRef.current = {
            ...internshipPhotoOverrideUrlsRef.current,

                            <svg className="w-5 h-5 text-emerald-400" fill="currentColor" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>
                          </div>
                          <div>
                            <div className="text-[10px] text-slate-400 font-semibold uppercase tracking-wider">WhatsApp</div>
                            <div className="text-xs text-white font-medium">+62 822-1051-8976</div>
                          </div>
                        </a>

                        <a
                          href={LINKEDIN_URL}
                          target="_blank"
                          rel="noopener noreferrer"
                          className="group flex items-center gap-3 bg-navy-900 hover:bg-blue-950/40 p-4 rounded-2xl border border-slate-800 hover:border-blue-500/40 transition-all"
                        >
                          <div className="w-10 h-10 rounded-xl bg-blue-500/10 border border-blue-500/30 flex items-center justify-center shrink-0">
                            <svg className="w-5 h-5 text-blue-400" fill="currentColor" viewBox="0 0 24 24"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
                          </div>
                          <div>
                            <div className="text-[10px] text-slate-400 font-semibold uppercase tracking-wider">LinkedIn</div>
                            <div className="text-xs text-cyan-300 font-medium">Jemeli S.Tr.M, CVDP</div>
                          </div>
                        </a>

                        <a
                          href={PDDIKTI_URL}
                          target="_blank"
                          rel="noopener noreferrer"
                          className="group flex items-center gap-3 bg-navy-900 hover:bg-cyan-950/40 p-4 rounded-2xl border border-slate-800 hover:border-cyan-500/40 transition-all"
                        >
                          <div className="w-10 h-10 rounded-xl bg-cyan-500/10 border border-cyan-500/30 flex items-center justify-center text-lg shrink-0">🔍</div>
                          <div>
                            <div className="text-[10px] text-slate-400 font-semibold uppercase tracking-wider">Verifikasi</div>
                            <div className="text-xs text-cyan-300 font-medium">Cek PDDikti ↗</div>
                          </div>
                        </a>
                      </div>

                      <div className="flex flex-wrap items-center justify-center gap-3">
                        <button onClick={handleDownloadCV} className="px-6 py-3 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 text-navy-950 font-bold text-xs uppercase">
                          Cetak / Simpan CV PDF
                        </button>
                        <a
                          href={LINKEDIN_URL}
                          target="_blank"
                          rel="noopener noreferrer"
                          className="px-6 py-3 rounded-xl bg-blue-700/20 border border-blue-500/40 text-blue-300 font-bold text-xs"
                        >
                          Buka LinkedIn Profile
                        </a>
                      </div>
                    </div>
                  )}

                </div>

                {/* BOTTOM SLIDE CONTROLLER */}
                <div className="w-full fixed bottom-4 left-0 right-0 z-30 px-4 no-print">
                  <div className="max-w-2xl mx-auto glass-panel rounded-2xl px-4 py-2.5 flex items-center justify-between border border-cyan-500/30">
                    <button onClick={prevSlide} className="px-3 py-1.5 rounded-lg bg-slate-900 text-xs text-slate-200">
                      ← Prev
                    </button>

                    <div className="flex items-center gap-2">
                      <span className="text-xs font-mono text-cyan-300">{String(currentSlide + 1).padStart(2,'0')} / {String(totalSlides).padStart(2,'0')}</span>
                      <div className="flex gap-1">
                        {Array.from({ length: totalSlides }).map((_, idx) => (
                          <button
                            key={idx} onClick={() => setCurrentSlide(idx)}
                            className={`h-2 rounded-full transition-all ${currentSlide === idx ? 'w-5 bg-cyan-400' : 'w-2 bg-slate-700'}`}
                          />
                        ))}
                      </div>
                    </div>

                    <div className="flex items-center gap-2">
                      <button onClick={() => setIsPlaying(!isPlaying)} className="px-3 py-1.5 rounded-lg bg-slate-900 text-xs text-cyan-300">
                        {isPlaying ? 'Pause' : 'Play 6s'}
                      </button>
                      <button onClick={nextSlide} className="px-4 py-1.5 rounded-lg bg-gradient-to-r from-cyan-500 to-blue-600 text-navy-950 font-bold text-xs">
                        Next →
                      </button>
                    </div>
                  </div>
                </div>

              </div>
            ) : (
              /* LANDING SCROLL VIEW */
              <div className="pt-24 pb-20 px-4 sm:px-8 max-w-7xl mx-auto space-y-12">
                <div className="glass-panel rounded-3xl p-6 sm:p-12 border border-cyan-500/30">
                  <div className="grid grid-cols-1 md:grid-cols-12 gap-8 items-center">
                    <div className="md:col-span-4 flex flex-col items-center">
                      <div className="w-56 h-72 rounded-3xl overflow-hidden border-2 border-cyan-400/50 shadow-2xl">
                        <img src="jemeli_profile.jpg" alt="JEMELI, S.Tr.M" className="w-full h-full object-cover object-top" />
                      </div>
                    </div>
                    <div className="md:col-span-8 space-y-3">
                      <h1 className="text-3xl sm:text-5xl font-extrabold text-white">JEMELI, S.Tr.M</h1>
                      <h2 className="text-lg sm:text-2xl text-gradient-cyan">Sarjana Terapan Manajemen Keuangan Sektor Publik (Cumlaude · IPK 3.59)</h2>
                      <p className="text-xs sm:text-sm text-slate-300 leading-relaxed">
                        Spesialis Akuntansi Pemerintahan, Audit Sektor Publik, Operasional Perbankan BTN (Magang Nilai A / IP 4.00), dan Riset EViews 12 (Skripsi Nilai A / IP 4.00).
                      </p>
                    </div>
                  </div>
                </div>

                <SkripsiChart />

                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                  {certList.map((c, i) => (
                    <div key={i} onClick={() => setSelectedCert(c)} className="glass-panel p-5 rounded-2xl cursor-pointer hover:border-cyan-400">
                      <span className="text-xs text-cyan-300 font-mono">{c.year}</span>
                      <h3 className="text-base font-bold text-white mt-1">{c.title}</h3>
                      <p className="text-xs text-slate-400">{c.issuer}</p>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </main>

          <CertModal cert={selectedCert} onClose={() => setSelectedCert(null)} />
          {selectedInternshipPhoto && (
            <InternshipPhotoLightbox
              photo={selectedInternshipPhoto}
              onClose={() => setSelectedInternshipPhoto(null)}
              triggerRef={internshipPhotoTriggerRef}
            />
          )}

          <footer className="glass-panel border-t border-cyan-500/20 py-6 text-center text-xs text-slate-400 no-print">
            © 2026 JEMELI, S.Tr.M — Politeknik Negeri Lhokseumawe.
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
